openapi: 3.0.3
info:
  title: ReLoop API v1
  version: 1.0.0
  description: |
    Contrato do MVP acadêmico Ecoponto (ReLoop). As operações implementadas
    estão identificadas nos resumos. No perfil local `bootstrap`, o catálogo
    usa dados fictícios; no `postgres`, usa o SQL do Hiago.
    Cadastro, login e catálogo são públicos nesses dois perfis.
    Perfil, fotos, descartes, carteira, recompensas e resgates exigem
    `Authorization: Bearer <token>`.
    O endpoint IoT usa a credencial `X-Device-Key`.
    No bootstrap os dados são temporários; no postgres são persistidos.
    Configure `JWT_SECRET` para iniciar qualquer um desses perfis. O README descreve como gerar o segredo e testar com
    dois usuários.
    O Swagger UI disponibiliza os modelos para consulta. O health check está
    disponível em `/actuator/health`.
    Os exemplos são ilustrativos; IDs e dados variam entre perfis. Respostas de erro
    trazem exemplos por causa, sem expor valores recebidos ou detalhes internos.
    Os campos JSON usam camelCase. Datas são emitidas em UTC no formato ISO 8601.
servers:
  - url: /
    description: Origem da aplicação
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Usuários
  - name: Pontos de coleta
  - name: Categorias
  - name: Fotos
  - name: Descartes
  - name: IoT
  - name: Carteira
  - name: Recompensas

paths:
  /api/v1/auth/register:
    post:
      tags: [Autenticação]
      operationId: register
      summary: Cadastrar cidadão (implementado no bootstrap e postgres)
      description: |
        Cria um usuário com e-mail normalizado em minúsculas e senha armazenada
        como hash. No bootstrap, o cadastro também abre uma carteira em
        memória com saldo zero. No postgres, usuário e carteira são persistidos
        na mesma transação.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              examples:
                Profile:
                  $ref: '#/components/examples/Profile'
        '400':
          $ref: '#/components/responses/EmailBadRequest'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Autenticação]
      operationId: login
      summary: Autenticar cidadão (implementado no bootstrap e postgres)
      description: Valida o e-mail e a senha e emite um token de acesso válido por 3600 segundos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT de acesso emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                Token:
                  $ref: '#/components/examples/Token'
        '400':
          $ref: '#/components/responses/EmailBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user:
    get:
      tags: [Usuários]
      operationId: getUserProfile
      summary: Consultar o perfil pelo contrato mobile (bootstrap e postgres)
      description: Retorna exclusivamente o usuário identificado pelo JWT, sem receber ID como parâmetro. Mesmo contrato de GET /api/v1/users/me, preservado para compatibilidade.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              examples:
                Profile:
                  $ref: '#/components/examples/Profile'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Usuários]
      operationId: updateUserProfile
      summary: Atualizar o perfil pelo contrato mobile (bootstrap e postgres)
      description: Atualiza nome e e-mail exclusivamente do titular do JWT. Mesmo corpo e resposta de PUT /api/v1/users/me, preservado para compatibilidade. O token continua identificando a mesma conta após a alteração.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              examples:
                Profile:
                  $ref: '#/components/examples/Profile'
        '400':
          $ref: '#/components/responses/EmailBadRequest'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me:
    get:
      tags: [Usuários]
      operationId: getMyProfile
      summary: Consultar o próprio perfil (implementado no bootstrap e postgres)
      responses:
        '200':
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              examples:
                Profile:
                  $ref: '#/components/examples/Profile'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Usuários]
      operationId: updateMyProfile
      summary: Atualizar o próprio perfil (implementado no bootstrap e postgres)
      description: Atualiza o nome e o e-mail do titular. O token atual identifica a mesma conta após a alteração.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              examples:
                Profile:
                  $ref: '#/components/examples/Profile'
        '400':
          $ref: '#/components/responses/EmailBadRequest'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collection-points:
    get:
      tags: [Pontos de coleta]
      operationId: listCollectionPoints
      summary: Listar pontos de coleta (implementado no bootstrap e postgres)
      description: |
        Nos perfis bootstrap e postgres, a consulta funciona sem JWT e retorna [] quando a lista está vazia.
        distanceFromUserLocation é uma distância simulada em quilômetros, estável pelo ID do ecoponto.
        Não usa localização do usuário e não representa distância real ou trajeto por ruas.
      security: []
      responses:
        '200':
          description: Locais de coleta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionPointResponse'
              examples:
                CollectionPoints:
                  $ref: '#/components/examples/CollectionPoints'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/collection-points/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Pontos de coleta]
      operationId: getCollectionPoint
      summary: Consultar ponto de coleta, categorias aceitas e coletores (implementado no bootstrap e postgres)
      description: |
        Nos perfis bootstrap e postgres, a consulta funciona sem JWT. Um ID positivo inexistente retorna 404.
        distanceFromUserLocation é a mesma distância simulada em quilômetros exibida na listagem.
        Não usa localização do usuário e não representa distância real ou trajeto por ruas.
      security: []
      responses:
        '200':
          description: Detalhes do local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPointDetailResponse'
              examples:
                CollectionPoint:
                  $ref: '#/components/examples/CollectionPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/electronic-categories:
    get:
      tags: [Categorias]
      operationId: listElectronicCategories
      summary: Listar categorias e parâmetros de pontuação (implementado no bootstrap e postgres)
      description: |
        Nos perfis bootstrap e postgres, a consulta funciona sem JWT e retorna os parâmetros
        armazenados no catálogo. Ao receber a pesagem, o backend valida
        o peso no intervalo inclusivo da categoria e calcula
        `min(maxPoints, roundHalfUp(basePoints + weightKg * pointsPerKg))`.
      security: []
      responses:
        '200':
          description: Categorias disponíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElectronicCategoryResponse'
              examples:
                Categories:
                  $ref: '#/components/examples/Categories'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/uploads:
    post:
      tags: [Fotos]
      operationId: uploadPhoto
      summary: Enviar foto do eletrônico (implementado no bootstrap e postgres)
      description: |
        Recebe um arquivo JPEG ou PNG de 1 byte a 10 MiB. A foto é vinculada ao usuário
        atual e poderá ser associada a um descarte dele. A URL absoluta é retornada
        em `photoUrl` para consultar a foto.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            encoding:
              file:
                contentType: 'image/jpeg, image/png'
      responses:
        '201':
          description: Foto recebida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              examples:
                Upload:
                  $ref: '#/components/examples/Upload'
        '400':
          $ref: '#/components/responses/UploadBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/PhotoUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/UploadInternalError'

  /api/v1/uploads/{photoId}:
    get:
      tags: [Fotos]
      operationId: getUploadedPhoto
      summary: Consultar foto pela URL retornada no upload (implementado no bootstrap e postgres)
      description: Disponibiliza a fotografia somente ao seu proprietário.
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PhotoId'
      responses:
        '200':
          description: Fotografia do eletrônico.
          headers:
            Cache-Control:
              description: Resposta privada com armazenamento em cache desabilitado.
              schema:
                type: string
                example: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PhotoNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/disposals:
    post:
      tags: [Descartes]
      operationId: startDisposal
      summary: Iniciar descarte (implementado no bootstrap e postgres)
      description: |
        O coletor e seu ponto de coleta devem estar ativos, e o ponto deve aceitar
        a categoria. A foto deve pertencer ao cidadão e estar livre para associação.
        Cada coletor admite uma sessão ativa por vez. O usuário é identificado pelo
        contexto da requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisposalRequest'
      responses:
        '201':
          description: Descarte em WAITING_WEIGHT, com peso e estimativa nulos e zero pontos creditados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposalResponse'
              examples:
                WaitingDisposal:
                  $ref: '#/components/examples/WaitingDisposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CreationNotFound'
        '409':
          $ref: '#/components/responses/CreationConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/CategoryNotAccepted'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/disposals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Descartes]
      operationId: getDisposal
      summary: Consultar descarte do usuário atual (implementado no bootstrap e postgres)
      responses:
        '200':
          description: Estado atual do descarte do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisposalResponse'
              examples:
                WaitingDisposal:
                  $ref: '#/components/examples/WaitingDisposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DisposalNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Descartes]
      operationId: cancelDisposal
      summary: Cancelar descarte que aguarda pesagem (implementado no bootstrap e postgres)
      description: O registro do usuário passa de WAITING_WEIGHT para CANCELLED, permanece no histórico e libera o coletor.
      responses:
        '204':
          description: Descarte cancelado. Sem corpo na resposta.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DisposalNotFound'
        '409':
          $ref: '#/components/responses/InvalidDisposalState'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/disposals:
    get:
      tags: [Descartes]
      operationId: listMyDisposals
      summary: Listar histórico de descartes do usuário atual (implementado no bootstrap e postgres)
      responses:
        '200':
          description: Descartes do usuário do mais recente ao mais antigo, inclusive os cancelados. Retorna um array
            vazio se não houver registros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisposalHistoryItem'
              examples:
                DisposalHistory:
                  $ref: '#/components/examples/DisposalHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/iot/events:
    post:
      tags: [IoT]
      operationId: receiveIotEvent
      summary: Receber evento do coletor simulado (implementado no bootstrap e postgres)
      description: |
        A credencial deve autorizar o `deviceId`, que deve corresponder ao coletor
        do descarte. As transições são WEIGHT_RECORDED (WAITING_WEIGHT →
        WAITING_DEPOSIT), DOOR_OPENED (WAITING_DEPOSIT → DEPOSIT_IN_PROGRESS) e
        DOOR_CLOSED (DEPOSIT_IN_PROGRESS → COMPLETED). O fechamento e o crédito
        de pontos ocorrem na mesma transação.
        Um `eventId` já processado com os mesmos valores retorna a resposta 200
        original sem novos efeitos, mesmo após outras transições. Números de
        peso equivalentes (por exemplo, 3.8 e 3.80) representam o mesmo valor.
        Reutilizar o identificador com dados diferentes gera 409.
        Eventos rejeitados podem ser corrigidos e reenviados. No perfil
        `bootstrap`, eventos e créditos ficam em memória até o reinício.
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IotEventRequest'
            examples:
              pesagem:
                value:
                  eventId: evt-001
                  deviceId: COL-001
                  disposalId: 42
                  eventType: WEIGHT_RECORDED
                  weightKg: 2.3
              abertura:
                value:
                  eventId: evt-002
                  deviceId: COL-001
                  disposalId: 42
                  eventType: DOOR_OPENED
              fechamento:
                value:
                  eventId: evt-003
                  deviceId: COL-001
                  disposalId: 42
                  eventType: DOOR_CLOSED
      responses:
        '200':
          description: Evento aceito ou repetição idêntica já processada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IotEventResponse'
              examples:
                WeightRecorded:
                  $ref: '#/components/examples/WeightRecorded'
                DoorOpened:
                  $ref: '#/components/examples/DoorOpened'
                DoorClosed:
                  $ref: '#/components/examples/DoorClosed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '403':
          $ref: '#/components/responses/DeviceForbidden'
        '404':
          $ref: '#/components/responses/IotNotFound'
        '409':
          $ref: '#/components/responses/IotConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/WeightOutOfRange'
        '500':
          $ref: '#/components/responses/IotInternalError'

  /api/v1/users/me/wallet:
    get:
      tags: [Carteira]
      operationId: getMyWallet
      summary: Consultar saldo e movimentações (implementado no bootstrap e postgres)
      description: Retorna o saldo do titular e as movimentações da mais recente para a mais antiga.
      responses:
        '200':
          description: Carteira do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
              examples:
                Wallet:
                  $ref: '#/components/examples/Wallet'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards:
    get:
      tags: [Recompensas]
      operationId: listRewards
      summary: Listar benefícios (implementado no bootstrap e postgres)
      description: Exibe custo, estoque e situação de cada benefício fictício.
      responses:
        '200':
          description: Benefícios e disponibilidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardResponse'
              examples:
                Rewards:
                  $ref: '#/components/examples/Rewards'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/rewards/{id}/redeem:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Recompensas]
      operationId: redeemReward
      summary: Resgatar benefício (implementado no bootstrap e postgres)
      description: |
        Envie a mesma Idempotency-Key ao repetir uma tentativa de resgate. A
        chave é vinculada ao usuário autenticado. Repetir a chave para o mesmo
        benefício após o sucesso devolve o 201 original com o mesmo cupom e sem
        novo débito. Usar essa chave para outro benefício gera 409. Um novo
        resgate exige uma nova chave. Saldo, estoque, débito e cupom são
        atualizados na mesma transação. Envie a requisição sem corpo.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador da tentativa gerado pelo cliente. Um UUID é uma opção.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]+$'
      responses:
        '201':
          description: Resgate confirmado, inclusive na repetição de uma tentativa concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionResponse'
              examples:
                Redemption:
                  $ref: '#/components/examples/Redemption'
        '400':
          $ref: '#/components/responses/RedemptionBadRequest'
        '401':
          $ref: '#/components/responses/IdentityUnauthorized'
        '404':
          $ref: '#/components/responses/RewardNotFound'
        '409':
          $ref: '#/components/responses/RedemptionConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/redemptions:
    get:
      tags: [Recompensas]
      operationId: listMyRedemptions
      summary: Listar cupons do usuário autenticado (implementado no bootstrap e postgres)
      description: Retorna os resgates do titular, do mais recente para o mais antigo.
      responses:
        '200':
          description: Resgates do usuário com os dados registrados na emissão.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RedemptionResponse'
              examples:
                Redemptions:
                  $ref: '#/components/examples/Redemptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Envie `Authorization: Bearer <token>`. O JWT é assinado com HS256 e
        contém `sub` (ID imutável do usuário como string), `iat` (emissão),
        `exp` (expiração) e `iss` (emissor da instância atual, em ambos os perfis).
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Credencial de teste do coletor simulado.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'

  responses:
    BadRequest:
      description: Entrada ausente, malformada ou inválida. A validação HTTP retorna a mensagem genérica Bad Request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
    EmailBadRequest:
      description: Entrada inválida ou e-mail que excede o limite após normalização.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
            EmailTooLong:
              $ref: '#/components/examples/EmailTooLong'
    UploadBadRequest:
      description: Parte file ausente, vazia ou conteúdo de imagem inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
            EmptyPhoto:
              $ref: '#/components/examples/EmptyPhoto'
            InvalidPhotoContent:
              $ref: '#/components/examples/InvalidPhotoContent'
    RedemptionBadRequest:
      description: ID ou Idempotency-Key ausente/inválido, ou corpo enviado indevidamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationError'
            RedemptionBody:
              $ref: '#/components/examples/RedemptionBody'
    Unauthorized:
      description: JWT ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            AuthenticationRequired:
              $ref: '#/components/examples/AuthenticationRequired'
            InvalidToken:
              $ref: '#/components/examples/InvalidToken'
      headers:
        WWW-Authenticate:
          description: 'Emitido pelo filtro JWT: Bearer quando o token está ausente; Bearer error="invalid_token"
            quando rejeitado.'
          schema:
            type: string
          examples:
            ausente:
              value: Bearer
            invalido:
              value: Bearer error="invalid_token"
    IdentityUnauthorized:
      description: JWT ausente/rejeitado ou identidade indisponível. O erro de identidade vem do serviço e não inclui
        WWW-Authenticate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            AuthenticationRequired:
              $ref: '#/components/examples/AuthenticationRequired'
            InvalidToken:
              $ref: '#/components/examples/InvalidToken'
            IdentityUnavailable:
              $ref: '#/components/examples/IdentityUnavailable'
      headers:
        WWW-Authenticate:
          description: 'Emitido pelo filtro JWT: Bearer quando o token está ausente; Bearer error="invalid_token"
            quando rejeitado.'
          schema:
            type: string
          examples:
            ausente:
              value: Bearer
            invalido:
              value: Bearer error="invalid_token"
    InvalidCredentials:

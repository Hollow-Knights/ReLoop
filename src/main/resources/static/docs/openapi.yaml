  schemas:
    EntityId:
      type: integer
      format: int64
      minimum: 1
      example: 42
    DeviceId:
      type: string
      minLength: 1
      maxLength: 64
      example: COL-001
    PhotoId:
      type: string
      format: uuid
      example: 0bcc2e7b-3d69-4af4-bfd9-5ed1f62985a5
    PhotoUrl:
      type: string
      format: uri
      description: URL absoluta autorizada para visualizar a foto. Pode ter validade limitada.
      example: http://localhost:8080/api/v1/uploads/0bcc2e7b-3d69-4af4-bfd9-5ed1f62985a5
    Points:
      type: integer
      format: int32
      minimum: 0
      example: 25
    WeightKg:
      type: number
      minimum: 0
      exclusiveMinimum: true
      multipleOf: 0.001
      maximum: 9999999.999
      description: Peso positivo em kg com no máximo três casas decimais; excesso de precisão retorna 400, sem arredondamento.
      example: 3.8
    NullableWeightKg:
      type: number
      nullable: true
      minimum: 0
      exclusiveMinimum: true
      multipleOf: 0.001
      maximum: 9999999.999
      description: Peso positivo em kg com no máximo três casas decimais ou null enquanto aguarda pesagem.
      example: 3.8
    NullablePoints:
      type: integer
      format: int32
      minimum: 0
      nullable: true
      description: Pontos estimados ou null enquanto aguarda pesagem.
      example: 25
    UtcTimestamp:
      type: string
      format: date-time
      example: '2026-11-12T22:30:00Z'
    UserName:
      type: string
      minLength: 1
      maxLength: 120
      example: Ana Silva
    Email:
      type: string
      format: email
      maxLength: 254
      example: ana@example.com
    DisposalStatus:
      type: string
      enum: [WAITING_WEIGHT, WAITING_DEPOSIT, DEPOSIT_IN_PROGRESS, COMPLETED, CANCELLED]
    IotEventType:
      type: string
      enum: [WEIGHT_RECORDED, DOOR_OPENED, DOOR_CLOSED]
    EventId:
      type: string
      minLength: 1
      maxLength: 128
      description: Identificador opaco e único por evento em todo o sistema.
      example: evt-001
    TransactionType:
      type: string
      enum: [CREDIT, DEBIT]
    ApiError:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        code:
          type: string
        message:
          type: string
        timestamp:
          $ref: '#/components/schemas/UtcTimestamp'

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          writeOnly: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/Email'
    ProfileResponse:
      type: object
      required: [id, name, email]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          $ref: '#/components/schemas/UserName'
        email:
          $ref: '#/components/schemas/Email'
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT de acesso.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          description: Tempo de validade em segundos.
          example: 3600

    SimulatedDistanceKm:
      type: number
      format: double
      minimum: 0
      readOnly: true
      description: Distância simulada em quilômetros para demonstração do MVP. Determinística pelo ID do ecoponto, idêntica na lista e no detalhe em ambos os perfis. Não usa GPS e não representa localização real, distância calculada ou trajeto por ruas.
      example: 1.2
    CollectionPointResponse:
      type: object
      required: [id, name, address, latitude, longitude, isActive, distanceFromUserLocation]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        isActive:
          type: boolean
        distanceFromUserLocation:
          $ref: '#/components/schemas/SimulatedDistanceKm'
    CollectionPointDetailResponse:
      allOf:
        - $ref: '#/components/schemas/CollectionPointResponse'
        - type: object
          required: [acceptedCategoryIds, devices]
          properties:
            acceptedCategoryIds:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/EntityId'
            devices:
              type: array
              items:
                $ref: '#/components/schemas/CollectionDeviceResponse'
    CollectionDeviceResponse:
      type: object
      required: [deviceId, isActive]
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        isActive:
          type: boolean
    ElectronicCategoryResponse:
      type: object
      required: [id, name, basePoints, pointsPerKg, maxPoints, minWeightKg, maxWeightKg]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
        basePoints:
          $ref: '#/components/schemas/Points'
        pointsPerKg:
          $ref: '#/components/schemas/Points'
        maxPoints:
          $ref: '#/components/schemas/Points'
        minWeightKg:
          $ref: '#/components/schemas/WeightKg'
        maxWeightKg:
          $ref: '#/components/schemas/WeightKg'

    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    UploadResponse:
      type: object
      required: [photoId, photoUrl]
      properties:
        photoId:
          $ref: '#/components/schemas/PhotoId'
        photoUrl:
          $ref: '#/components/schemas/PhotoUrl'
    CreateDisposalRequest:
      type: object
      additionalProperties: false
      required: [deviceId, categoryId, itemName, photoId]
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        categoryId:
          $ref: '#/components/schemas/EntityId'
        itemName:
          type: string
          minLength: 1
          maxLength: 120
          example: Air fryer
        photoId:
          $ref: '#/components/schemas/PhotoId'
    DisposalResponse:
      allOf:
        - $ref: '#/components/schemas/DisposalHistoryItem'
        - type: object
          required: [deviceId, photoId, photoUrl, estimatedPoints]
          properties:
            deviceId:
              $ref: '#/components/schemas/DeviceId'
            photoId:
              $ref: '#/components/schemas/PhotoId'
            photoUrl:
              $ref: '#/components/schemas/PhotoUrl'
            estimatedPoints:
              $ref: '#/components/schemas/NullablePoints'
    DisposalHistoryItem:
      type: object
      required: [id, itemName, categoryId, status, weightKg, awardedPoints, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        itemName:
          type: string
          example: Air fryer
        categoryId:
          $ref: '#/components/schemas/EntityId'
        status:
          $ref: '#/components/schemas/DisposalStatus'
        weightKg:
          $ref: '#/components/schemas/NullableWeightKg'
        awardedPoints:
          $ref: '#/components/schemas/Points'
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'

    IotEventRequest:
      type: object
      additionalProperties: false
      required: [eventId, deviceId, disposalId, eventType]
      properties:
        eventId:
          $ref: '#/components/schemas/EventId'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        disposalId:
          $ref: '#/components/schemas/EntityId'
        eventType:
          $ref: '#/components/schemas/IotEventType'
        weightKg:
          $ref: '#/components/schemas/WeightKg'
      oneOf:
        - required: [weightKg]
          properties:
            eventType:
              enum: [WEIGHT_RECORDED]
        - not:
            required: [weightKg]
          properties:
            eventType:
              enum: [DOOR_OPENED, DOOR_CLOSED]
    IotEventResponse:
      type: object
      required: [eventId, disposalId, status, weightKg, estimatedPoints, awardedPoints]
      properties:
        eventId:
          $ref: '#/components/schemas/EventId'
        disposalId:
          $ref: '#/components/schemas/EntityId'
        status:
          $ref: '#/components/schemas/DisposalStatus'
        weightKg:
          $ref: '#/components/schemas/NullableWeightKg'
        estimatedPoints:
          $ref: '#/components/schemas/NullablePoints'
        awardedPoints:
          $ref: '#/components/schemas/Points'

    WalletResponse:
      type: object
      required: [availablePoints, totalEarned, totalRedeemed, transactions]
      properties:
        availablePoints:
          $ref: '#/components/schemas/Points'
        totalEarned:
          $ref: '#/components/schemas/Points'
        totalRedeemed:
          $ref: '#/components/schemas/Points'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PointTransactionResponse'
    PointTransactionResponse:
      type: object
      required: [id, type, points, description, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        type:
          $ref: '#/components/schemas/TransactionType'
        points:
          type: integer
          format: int32
          minimum: 1
          description: Magnitude positiva. O tipo indica a direção da movimentação.
          example: 25
        description:
          type: string
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
    RewardResponse:
      type: object
      required: [id, name, description, partnerName, costPoints, availableQuantity, active]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
        description:
          type: string
        partnerName:
          type: string
        costPoints:
          type: integer
          format: int32
          minimum: 1
        availableQuantity:
          type: integer
          format: int32
          minimum: 0
        active:
          type: boolean
    RedemptionResponse:
      type: object
      required: [redemptionId, rewardId, rewardName, pointsSpent, remainingPoints, couponCode, redeemedAt]
      properties:
        redemptionId:
          $ref: '#/components/schemas/EntityId'
        rewardId:
          $ref: '#/components/schemas/EntityId'
        rewardName:
          type: string
        pointsSpent:
          type: integer
          format: int32
          minimum: 1
        remainingPoints:
          allOf:
            - $ref: '#/components/schemas/Points'
          description: Saldo imediatamente após o resgate, preservado no histórico.
        couponCode:
          type: string
        redeemedAt:
          $ref: '#/components/schemas/UtcTimestamp'

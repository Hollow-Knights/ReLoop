spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

reloop:
  jwt:
    secret: "${JWT_SECRET:}"
  photo:
    base-url: ${PHOTO_BASE_URL:http://localhost:${server.port:8080}}
  iot:
    device-id: ${IOT_DEVICE_ID:COL-001}
    device-key: "${IOT_DEVICE_KEY:}"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    url: /docs/openapi.yaml
    disable-swagger-default-url: true
    supported-submit-methods: []
